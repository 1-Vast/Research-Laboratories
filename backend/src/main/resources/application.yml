spring:
  application:
    name: labflow
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  mvc:
    problemdetails:
      enabled: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
  shutdown: graceful
  servlet:
    encoding:
      charset: UTF-8
      force: true

logging:
  pattern:
    # traceId 由 TraceIdFilter 写入 MDC，日志与响应体、审计记录可据此对齐
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:-no-trace}] %logger{40} - %msg%n"
  level:
    com.labflow: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  paths-to-match: /api/**

labflow:
  jwt:
    issuer: labflow
    # 未配置时启动阶段随机生成（重启后旧令牌失效），生产必须通过环境变量注入
    signing-key: ${JWT_SIGNING_KEY:}
    access-ttl: ${JWT_ACCESS_TTL:PT15M}
    refresh-ttl: ${JWT_REFRESH_TTL:P7D}
  security:
    refresh-cookie-name: labflow_refresh
    refresh-cookie-path: /api/v1/auth
    # 本地 HTTP 调试为 false；生产 HTTPS 必须为 true
    refresh-cookie-secure: ${COOKIE_SECURE:false}
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  password:
    min-length: 8
    max-length: 64
