spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/labflow}
    username: ${DB_USER:labflow}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}

labflow:
  security:
    refresh-cookie-secure: ${COOKIE_SECURE:true}

logging:
  level:
    com.labflow: INFO
